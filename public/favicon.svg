<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- background circle -->
  <rect width="32" height="32" rx="8" fill="#4f46e5"/>
  <!-- document body -->
  <rect x="8" y="5" width="13" height="17" rx="1.5" fill="white" opacity="0.15"/>
  <rect x="8" y="5" width="13" height="17" rx="1.5" stroke="white" stroke-width="1.5"/>
  <!-- folded corner -->
  <path d="M17 5 L21 9 L17 9 Z" fill="white" opacity="0.4"/>
  <path d="M17 5 L21 9 H17 V5 Z" fill="#4f46e5" opacity="0.6"/>
  <line x1="17" y1="5" x2="17" y2="9" stroke="white" stroke-width="1"/>
  <line x1="17" y1="9" x2="21" y2="9" stroke="white" stroke-width="1"/>
  <!-- lines representing text -->
  <line x1="11" y1="13" x2="18" y2="13" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="16" x2="18" y2="16" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="19" x2="15" y2="19" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <!-- pen accent -->
  <line x1="20" y1="20" x2="26" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="19.5" cy="19.5" r="1.5" fill="#a5b4fc"/>
</svg>
